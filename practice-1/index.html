<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <title>Practice 1 - Temperature Converter</title>
</head>
<body>
    <div class="parent">
        <div class="container">
            <h1> TEMPERATURE CONVERTER </h1>
            <p id="tempDisplay"> 00.0°F </p>
            <div class="InputContainer">
                <span id="toBeInputTemp">°C</span>
                <input id="tempInput" type="number" step="00.0" placeholder="00.0" class="Inputs" /> 
                <button id="convertButton" class="Inputs"> Convert </button>
                <button id="changeConverter" class="Inputs"> To °C </button>
            </div> 
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
