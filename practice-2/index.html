<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <title> Practice 2 : Random Pick Anime </title>
</head>
<body onload="randomAnime()">
    <header>
        Random Anime Picker
    </header>
    <main>
        <div id="displayer">
            <div id="imageDisplay">
                <img id="image" src="https://preview.redd.it/re-zero-season-4-new-key-visual-v0-quxstf76kjng1.jpeg?auto=webp&s=16b6e1853076df8885c61caaebd9eb2abc54c43e" alt="Random Anime Picture">
            </div>
            <div id="informationDisplay">
                <p id="title"></p>
                <p id="genre"></p>
                <br>
                <p id="description"> </p>
            </div>
        </div>
        <button id="randomButton"> Random Anime </button>
    </main>
    <script src="script.js"></script>
</body>
</html>
